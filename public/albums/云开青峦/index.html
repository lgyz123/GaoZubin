          <figcaption>
            
            <div class="photo-desc">此作以横向长卷铺陈山间云气的流动性，层层远山以淡墨叠染，营造出空蒙氤氲的气象。左侧大面积以湿墨渲染林海的厚重，树冠虚实相间，形成强烈的空间深度。画面逐渐向右过渡为开阔的田园与村落，房舍以淡彩勾染，轻重有致，使山林的沉郁与人居的静谧形成对比。整体构图松弛自然，云雾、山势、林线与村庄互相呼应，呈现出“云开万岭、气象初晴”的视觉格局，意境清润宽远。</div>
          </figcaption>
