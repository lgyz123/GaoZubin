  <h1>凉山访友</h1>

  
  

  
  <div class="photo-grid">
    
      
      
        
      

      <figure class="photo-item">
        
        <a href="/uploads/albums/%e5%87%89%e5%b1%b1%e8%ae%bf%e5%8f%8b.jpg"

          <figcaption>
            
            <div class="photo-desc">山体以皴擦堆叠，高耸入云，呈现出古典山水中“高山仰止”的雄伟感。山峰多以灰绿、淡褐轻染，不喧闹却有质感，远处云雾翻涌，使画面深度不断向后延伸。
画面下方的院落与人物则构成了“动”的部分：红叶映屋、松枝交错，亭台错落在山脚，颜色温暖，与上方冷峻的奇峰形成鲜明对比。一位身着红衣的访客正踏桥而来，整体氛围像是“山中久居的友人迎来外客”，带着清雅的人情味。
整幅作品既有壮丽山势也有生活气，典型的文人山水叙事：
山高路远，仍愿赴一段故人之约。
寓意友情长久、贵人相助、心意可达、来者皆善。
非常适合挂在书房、会客空间、茶室或者讲究“雅与静”的地方。</div>
          </figcaption>
        
      </figure>
