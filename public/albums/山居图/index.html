  <h1>山居图</h1>

  
  

  
  <div class="photo-grid">

          <figcaption>
            
            <div class="photo-desc">整幅作品的中心是一片浓密的青绿密林，以重彩与破笔交叠铺开，呈现出蓬勃旺盛的自然气息。这片森林几乎吞没了山体，让画面出现一种“人迹罕至”的野性魅力。墨色与绿色互相渗染，使树冠层次丰厚，形成非常独特的视觉重心。
山间小屋点缀于三处：高处、腰处与谷底，红顶在深绿之间尤为醒目，让画面既有旷野感也不失生活痕迹。它们沿山势而建，隐隐构成纵向的动线，把观者目光从画底慢慢带到山巅。
雾气在山谷间流动，柔化了山石的硬度，让画面在厚重的主色调之外，多了几分灵气和平衡感。整体构图强，但情绪却安静，典型的“深山无语，却自有万物生长”的格局。
作品寓意：
深根静养、静处得力、繁盛向上、家宅深稳。
适合挂在书房、会客区、茶室、民宿或任何需要“稳重 &#43; 生气 &#43; 层次深”的空间。</div>
          </figcaption>
        
      </figure>
