          <figcaption>
            
            <div class="photo-desc">主峰以厚重的皴笔堆叠而成，山体棱角分明，却因层层云雾的环绕而显得深不可测。画家以冷青与淡墨交替染山，使岩石既有温度又带点金石般的硬朗质感。
画中最吸引人的，是云海的处理：大片留白配合湿墨渲染，让云雾像潮水般涌动，与山势抗衡，形成强烈的动感张力。山顶的松树孤立于风中，姿态劲挺，是整幅画的精神锚点。
整体呈现出一种“山行万里，天地忽开”的力量感，格局大、气息稳，用来布置家中或商业空间都有压轴效果。</div>
          </figcaption>
        
      </figure>
