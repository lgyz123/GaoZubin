  <h1>千里江山图卷</h1>

        <a href="/uploads/albums/%e5%8d%83%e9%87%8c%e6%b1%9f%e5%b1%b1%e5%9b%be%e5%8d%b7.jpg"

          <figcaption>
            
            <div class="photo-desc">这幅作品以典型的“高远”构图展开：前景的深绿密林以破墨与重彩叠染，厚实、蓬勃，形成画面的重量所在。树冠层层起伏，墨色与翠色交织，呈现出生命密度极高的林海气息。
山势从右侧陡峭岩壁向左缓缓推开，逐渐过渡为大片淡雅的田畴与山谷。中远景以浅墨勾勒，线条松弛，色彩轻盈，形成与前景“厚薄对照”的经典层次。田野纹理纵横交错，河道蜿蜒其间，使整幅作品像一卷徐徐展开的大地图景。
远处聚落以淡红点出，恰到好处地稳定视线，也为宏大的自然景观加入一丝人间温度。天空留白广阔，让画面显得更加通透、辽远。
整幅作品的气质视野宽阔、山河平和、自然深邃、人间安定。
寓意有胸怀广阔、前路绵长、事业伸展、家运安稳。
非常适合挂在客厅、会议室、书房或任何需要“气度”与“开阔感”的空间。</div>
          </figcaption>
