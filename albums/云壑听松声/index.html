ewBox="0 0 24 24" aria-hidden="true"><path clip-rule="evenodd" fill-rule="evenodd" d="M5.47 5.47a.75.75.0 011.06.0L12 10.94l5.47-5.47a.75.75.0 111.06 1.06L13.06 12l5.47 5.47a.75.75.0 11-1.06 1.06L12 13.06l-5.47 5.47a.75.75.0 01-1.06-1.06L10.94 12 5.47 6.53a.75.75.0 010-1.06z"/></svg></button></li></ul></header><menu class=hidden id=menu><li itemscope itemtype=http://www.schema.org/SiteNavigationElement><a aria-current=false href=/contact/ itemprop=url><span itemprop=name>联系 / Purchase & Contact</span></a></li><li itemscope itemtype=http://www.schema.org/SiteNavigationElement><a aria-current=false href=/submit/ itemprop=url><span itemprop=name>投稿</span></a></li></menu><main><main class=album><h1>云壑听松声</h1><div class=photo-grid><figure class=photo-item><img src=/%e4%ba%91%e5%a3%91%e5%90%ac%e6%9d%be%e5%a3%b0.jpg alt><figcaption><div class=photo-desc>群峰以苍劲浓墨勾勒，山石纹理刚硬而富层次。松树伫立在险峰之上，枝势苍古，像在风中长吟。画面右侧云海翻涌，几乎将远山完全吞没，只留下一线剪影，让山势显得更深、更远。
水流自岩隙间倾泻而下，以破墨写成，湿笔的渗化与干笔的皴擦形成强烈对比，使整幅画的节奏感鲜明。整体色调清冷，气质沉稳，有典型“北派山水”的雄浑之美。
这幅画特别适合挂在书房、办公室、玄关等需要提升气场的空间，视觉力量强但不浮躁，有种“松声入耳，万念自清”的沉静力量。</div></figcaption></figure></div><script src=https://giscus.app/client.js data-repo=lgyz123/GaoZubin data-repo-id=R_kgDOQbM8gg data-category=[在此输入分类名] data-category-id="[在此输入分类 ID]" data-mapping=pathname data-strict=0 data-reactions-enabled=1 data-emit-metadata=0 data-input-position=bottom data-theme=preferred_color_scheme data-lang=zh-CN crossorigin=anonymous async></script></main></main><footer class=site-footer><a class=social-icon href=https://www.douyin.com/user/48740764510 target=_blank rel=noopener><img src=/icons/douyin.svg alt=抖音></a></section><section class=footer-inner><p class=footer-copy>© 2025 高祖兵 · 山水画廊</p><p class=footer-note>部分作品接受咨询与收藏，详情请见「联系」页面。</p><p class=footer-menu></p><p class=footer-admin><a href=/admin/>管理者登录</a></p></section></footer></body></html>
