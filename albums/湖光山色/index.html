ria-hidden="true"><path clip-rule="evenodd" fill-rule="evenodd" d="M5.47 5.47a.75.75.0 011.06.0L12 10.94l5.47-5.47a.75.75.0 111.06 1.06L13.06 12l5.47 5.47a.75.75.0 11-1.06 1.06L12 13.06l-5.47 5.47a.75.75.0 01-1.06-1.06L10.94 12 5.47 6.53a.75.75.0 010-1.06z"/></svg></button></li></ul></header><menu class=hidden id=menu><li itemscope itemtype=http://www.schema.org/SiteNavigationElement><a aria-current=false href=/contact/ itemprop=url><span itemprop=name>联系 / Purchase & Contact</span></a></li><li itemscope itemtype=http://www.schema.org/SiteNavigationElement><a aria-current=false href=/submit/ itemprop=url><span itemprop=name>投稿</span></a></li><li itemscope itemtype=http://www.schema.org/SiteNavigationElement><a aria-current=false href=/about/ itemprop=url><span itemprop=name>画家简介</span></a></li></menu><main><main class=album><h1>湖光山色</h1><div class=photo-grid><figure class=photo-item><a href=/uploads/albums/%e6%b9%96%e5%85%89%e5%b1%b1%e8%89%b2.jpg class=glightbox data-gallery=album><img src=/uploads/albums/%e6%b9%96%e5%85%89%e5%b1%b1%e8%89%b2.jpg alt></a><figcaption><div class=photo-desc>这幅是典型的小幅秀雅山水，气质很温和。构图采取“前暗后亮”的结构，前景的巨石与阴影压住画底，让视觉自然往中远景的湖光里走。
中段几棵修长的乔木立在岸边，笔触干湿交错，树干偏硬朗，枝叶却保持水墨的松散感，形成对比。右侧那片橘红树，是全画唯一的暖色重笔，点亮季节感，也给素冷的湖景增加呼吸。
湖面用极淡色敷染，留白多，显得轻盈。最妙的是小小一艘舟，站着一个人，动作简洁，起到了“以小显大”的空间效果，让湖面一下子变得辽阔，也让画多了生活气。
远处村落以细笔勾线，房顶与墙体颜色很克制，避免分散主体。整幅画的气氛就是——初夏的湖山安静、缓慢、清透，有一种“日常风景的诗意”。
寓意：
湖映山，山藏村，人渡水，日常就是风景。</div></figcaption></figure></div><script src=https://giscus.app/client.js data-repo=lgyz123/GaoZubin data-repo-id=R_kgDOQbM8gg data-category=[在此输入分类名] data-category-id="[在此输入分类 ID]" data-mapping=pathname data-strict=0 data-reactions-enabled=1 data-emit-metadata=0 data-input-position=bottom data-theme=preferred_color_scheme data-lang=zh-CN crossorigin=anonymous async></script></main></main><footer class=site-footer><div class=footer-inner><div class=footer-left><p class=footer-brand>高祖兵 · 山水画廊</p><p class=footer-copy>© 2025 Gao Zubing. All rights reserved.</p></div><div class=footer-center><p class=footer-note>部分作品接受咨询与收藏，详情可通过抖音或留言联系。*温馨提示：可以点击图片查看大图哦！*</p></div><div class=footer-right><div class=footer-social><a href=https://www.douyin.com/user/48740764510 target=_blank rel=noopener title="抖音 · 高祖兵山水"><img src=/icons/douyin.svg alt=抖音 class=icon-douyin></a></div><p class=footer-admin><a href=/admin/>管理者登录</a></p></div></div></footer></body></html>
