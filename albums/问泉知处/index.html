ria-hidden="true"><path clip-rule="evenodd" fill-rule="evenodd" d="M5.47 5.47a.75.75.0 011.06.0L12 10.94l5.47-5.47a.75.75.0 111.06 1.06L13.06 12l5.47 5.47a.75.75.0 11-1.06 1.06L12 13.06l-5.47 5.47a.75.75.0 01-1.06-1.06L10.94 12 5.47 6.53a.75.75.0 010-1.06z"/></svg></button></li></ul></header><menu class=hidden id=menu><li itemscope itemtype=http://www.schema.org/SiteNavigationElement><a aria-current=false href=/contact/ itemprop=url><span itemprop=name>联系 / Purchase & Contact</span></a></li><li itemscope itemtype=http://www.schema.org/SiteNavigationElement><a aria-current=false href=/submit/ itemprop=url><span itemprop=name>投稿</span></a></li></menu><main><main class=album><h1>问泉知处</h1><div class=photo-grid><figure class=photo-item><a href=/uploads/albums/%e9%97%ae%e6%b3%89%e7%9f%a5%e5%a4%84.jpg class=glightbox data-gallery=album><img src=/uploads/albums/%e9%97%ae%e6%b3%89%e7%9f%a5%e5%a4%84.jpg alt></a><figcaption><div class=photo-desc>此画以深山峡谷为骨架，结构紧密而跌宕。主峰以浓淡皴擦叠出坚硬岩壁，质感粗砺，呈现典型的北派山石力度。山间水汽与飞瀑交织，使“硬”与“柔”形成鲜明对照。
中部的松林极为抢眼，以密针笔触堆叠，层层向深处延展，树冠压低形成视觉重心，带出一种“山中浓荫无人至”的气息。松枝间点缀的嫩绿芽苞，让整体在冷灰调中闪出一丝灵动。
瀑布的处理简洁但干净，留白做水，边缘勾线克制，使水势自然落下又不喧宾夺主。
前景小桥与人物是画意核心。道人立于流水桥上，手执竹杖，静观泉源，行到深山才遇水声渐响，形成“以人点境”的传统笔法。人物虽小，但心境被整个画面放大，呈现出清、静、远三味俱足的意境。
整体气质：
山深水急，心静路长，带着探寻与超脱感。
寓意：
寻本问源、返观自心、止于至善。</div></figcaption></figure></div><script src=https://giscus.app/client.js data-repo=lgyz123/GaoZubin data-repo-id=R_kgDOQbM8gg data-category=[在此输入分类名] data-category-id="[在此输入分类 ID]" data-mapping=pathname data-strict=0 data-reactions-enabled=1 data-emit-metadata=0 data-input-position=bottom data-theme=preferred_color_scheme data-lang=zh-CN crossorigin=anonymous async></script></main></main><footer class=site-footer><a class=social-icon href=https://www.douyin.com/user/48740764510 target=_blank rel=noopener><img src=/icons/douyin.svg alt=抖音></a></section><section class=footer-inner><p class=footer-copy>© 2025 高祖兵 · 山水画廊</p><p class=footer-note>部分作品接受咨询与收藏，详情请见「联系」页面。</p><p class=footer-menu></p><p class=footer-admin><a href=/admin/>管理者登录</a></p></section></footer></body></html>
