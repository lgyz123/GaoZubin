ria-hidden="true"><path clip-rule="evenodd" fill-rule="evenodd" d="M5.47 5.47a.75.75.0 011.06.0L12 10.94l5.47-5.47a.75.75.0 111.06 1.06L13.06 12l5.47 5.47a.75.75.0 11-1.06 1.06L12 13.06l-5.47 5.47a.75.75.0 01-1.06-1.06L10.94 12 5.47 6.53a.75.75.0 010-1.06z"/></svg></button></li></ul></header><menu class=hidden id=menu><li itemscope itemtype=http://www.schema.org/SiteNavigationElement><a aria-current=false href=/contact/ itemprop=url><span itemprop=name>联系 / Purchase & Contact</span></a></li><li itemscope itemtype=http://www.schema.org/SiteNavigationElement><a aria-current=false href=/submit/ itemprop=url><span itemprop=name>投稿</span></a></li></menu><main><main class=album><h1>云岭人居</h1><div class=photo-grid><figure class=photo-item><a href=/uploads/albums/%e4%ba%91%e5%b2%ad%e4%ba%ba%e5%b1%85.jpg class=glightbox data-gallery=album><img src=/uploads/albums/%e4%ba%91%e5%b2%ad%e4%ba%ba%e5%b1%85.jpg alt></a><figcaption><div class=photo-desc>这幅作品以云山为幕、村落为眼，构成了典型的“云岭深居”意境。画面上方大片留白处理成翻卷的山中雾气，将群峰的体积弱化成虚影，让背景层层递退，空间深度自然展开。
中景的村庄采用淡墨勾线、赭石点瓦，色彩克制但非常有气口，显得生活气息十足。屋舍错落有致，院落之间留有呼吸空间，既有真实乡野格局，又有文人气质的“隐居感”。
前景树木以点笔细密铺陈，杂树、松树、灌丛共同织出一片丰富的纹理层。黑、灰、绿的交叠让树林显得深沉茂密，与上方轻雾形成鲜明“虚实对照”。左侧的山路蜿蜒而上，是全画最强的引导线，把观者的视线从林下直接牵往村落，使画面叙事自然且流畅。
整幅作品整体气质是：
安宁、清润、藏于山中的烟火气。
寓意：
家宅宁稳，人事和顺，山环水抱，宜居宜心。
非常适合作为客厅、玄关、会客区的“安家类”山水主画。</div></figcaption></figure></div><script src=https://giscus.app/client.js data-repo=lgyz123/GaoZubin data-repo-id=R_kgDOQbM8gg data-category=[在此输入分类名] data-category-id="[在此输入分类 ID]" data-mapping=pathname data-strict=0 data-reactions-enabled=1 data-emit-metadata=0 data-input-position=bottom data-theme=preferred_color_scheme data-lang=zh-CN crossorigin=anonymous async></script></main></main><footer class=site-footer><a class=social-icon href=https://www.douyin.com/user/48740764510 target=_blank rel=noopener><img src=/icons/douyin.svg alt=抖音></a></section><section class=footer-inner><p class=footer-copy>© 2025 高祖兵 · 山水画廊</p><p class=footer-note>部分作品接受咨询与收藏，详情请见「联系」页面。</p><p class=footer-menu></p><p class=footer-admin><a href=/admin/>管理者登录</a></p></section></footer></body></html>
