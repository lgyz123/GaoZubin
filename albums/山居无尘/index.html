ria-hidden="true"><path clip-rule="evenodd" fill-rule="evenodd" d="M5.47 5.47a.75.75.0 011.06.0L12 10.94l5.47-5.47a.75.75.0 111.06 1.06L13.06 12l5.47 5.47a.75.75.0 11-1.06 1.06L12 13.06l-5.47 5.47a.75.75.0 01-1.06-1.06L10.94 12 5.47 6.53a.75.75.0 010-1.06z"/></svg></button></li></ul></header><menu class=hidden id=menu><li itemscope itemtype=http://www.schema.org/SiteNavigationElement><a aria-current=false href=/contact/ itemprop=url><span itemprop=name>联系 / Purchase & Contact</span></a></li><li itemscope itemtype=http://www.schema.org/SiteNavigationElement><a aria-current=false href=/submit/ itemprop=url><span itemprop=name>投稿</span></a></li></menu><main><main class=album><h1>山居无尘</h1><div class=photo-grid><figure class=photo-item><a href=/uploads/albums/%e5%b1%b1%e5%b1%85%e6%97%a0%e5%b0%98.jpg class=glightbox data-gallery=album><img src=/uploads/albums/%e5%b1%b1%e5%b1%85%e6%97%a0%e5%b0%98.jpg alt></a><figcaption><div class=photo-desc>这幅画没有夸张的大山大水，而是把山、屋、水这三个意象压成一个内敛的结构，氛围更稳。
前景的青石块处理得很老练，皴纹走势干脆，冷青与淡墨叠色，让石头显得硬、沉、有岁月感。右侧那棵树的树冠用的是密点法，暗部压得狠，正好把画面的光线集中到房屋那一片，让“山居”成为视觉焦点。
屋舍比例画得偏小，但笔法干净，屋檐、窗线都保持了那种“写意中的工笔感”。特别是处理墙体的留白，看起来像是刚被晨光擦亮，十分自然。
中景的江面铺得很开，水纹用极淡墨扫出层次，远山则一片模糊，是典型的“虚实互见”处理。左边的小舟只用几笔，但撑篙的人物，恰好让整幅画有了生活气息，不至于太静。
整幅画的气质：
静水抱屋，远山无声，像是住进去就能把尘世关在门外。</div></figcaption></figure></div><script src=https://giscus.app/client.js data-repo=lgyz123/GaoZubin data-repo-id=R_kgDOQbM8gg data-category=[在此输入分类名] data-category-id="[在此输入分类 ID]" data-mapping=pathname data-strict=0 data-reactions-enabled=1 data-emit-metadata=0 data-input-position=bottom data-theme=preferred_color_scheme data-lang=zh-CN crossorigin=anonymous async></script></main></main><footer class=site-footer><a class=social-icon href=https://www.douyin.com/user/48740764510 target=_blank rel=noopener><img src=/icons/douyin.svg alt=抖音></a></section><section class=footer-inner><p class=footer-copy>© 2025 高祖兵 · 山水画廊</p><p class=footer-note>部分作品接受咨询与收藏，详情请见「联系」页面。</p><p class=footer-menu></p><p class=footer-admin><a href=/admin/>管理者登录</a></p></section></footer></body></html>
