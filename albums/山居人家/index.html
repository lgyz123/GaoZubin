ria-hidden="true"><path clip-rule="evenodd" fill-rule="evenodd" d="M5.47 5.47a.75.75.0 011.06.0L12 10.94l5.47-5.47a.75.75.0 111.06 1.06L13.06 12l5.47 5.47a.75.75.0 11-1.06 1.06L12 13.06l-5.47 5.47a.75.75.0 01-1.06-1.06L10.94 12 5.47 6.53a.75.75.0 010-1.06z"/></svg></button></li></ul></header><menu class=hidden id=menu><li itemscope itemtype=http://www.schema.org/SiteNavigationElement><a aria-current=false href=/contact/ itemprop=url><span itemprop=name>联系 / Purchase & Contact</span></a></li><li itemscope itemtype=http://www.schema.org/SiteNavigationElement><a aria-current=false href=/submit/ itemprop=url><span itemprop=name>投稿</span></a></li></menu><main><main class=album><h1>山居人家</h1><div class=photo-grid><figure class=photo-item><img src=/uploads/albums/%e5%b1%b1%e5%b1%85%e4%ba%ba%e5%ae%b6.jpg alt><figcaption><div class=photo-desc>浅赭、淡褐与雾白交织出柔和的山色，整幅作品弥漫着“云从山起，山随云隐”的轻盈气息。山体以淡墨皴染，不追求锋利，而是呈现一种岁月沉淀后的温润感。画面下方的石阶蜿蜒而上，引导视线逐层攀升，最终抵达半山中隐隐可见的人家。
房舍以青瓦、白墙点染，在暖秋的树色中尤为宁静，与前景的松枝相互呼应，给画面增添生活气。云雾在屋后轻轻翻卷，使远山若隐若现，整体空间层次柔和又耐看。
这幅作品的气质是典型“山中岁月慢、云里有人家”的意境，
象征：
安稳、归心、隐逸、家运和顺。
非常适合挂在卧室、客厅、养老居所、茶室等讲究安宁氛围的空间。</div></figcaption></figure></div><script src=https://giscus.app/client.js data-repo=lgyz123/GaoZubin data-repo-id=R_kgDOQbM8gg data-category=[在此输入分类名] data-category-id="[在此输入分类 ID]" data-mapping=pathname data-strict=0 data-reactions-enabled=1 data-emit-metadata=0 data-input-position=bottom data-theme=preferred_color_scheme data-lang=zh-CN crossorigin=anonymous async></script></main></main><footer class=site-footer><a class=social-icon href=https://www.douyin.com/user/48740764510 target=_blank rel=noopener><img src=/icons/douyin.svg alt=抖音></a></section><section class=footer-inner><p class=footer-copy>© 2025 高祖兵 · 山水画廊</p><p class=footer-note>部分作品接受咨询与收藏，详情请见「联系」页面。</p><p class=footer-menu></p><p class=footer-admin><a href=/admin/>管理者登录</a></p></section></footer></body></html>
