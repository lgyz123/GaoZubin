<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>画廊后台（简易版）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      max-width: 840px;
      margin: 40px auto;
      padding: 0 16px;
      line-height: 1.6;
    }
    h1 { font-size: 1.6rem; margin-bottom: 0.5rem; }
    h2 { font-size: 1.2rem; margin-top: 1.5rem; }
    label { display: block; margin: 8px 0 4px; font-weight: 600; }
    input[type="text"], input[type="password"], textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.95rem;
    }
    textarea { resize: vertical; min-height: 80px; }
    button {
      margin-top: 12px;
      padding: 6px 14px;
      border: none;
      border-radius: 4px;
      background: #333;
      color: #fff;
      cursor: pointer;
      font-size: 0.95rem;
    }
    button:disabled { opacity: 0.6; cursor: default; }
    #login-msg { color: #c0392b; margin-top: 6px; }
    #save-msg { margin-top: 8px; }
  </style>
</head>
<body>
  <h1>画廊后台（简易版）</h1>

  <section id="login-section">
    <h2>登录</h2>
    <label>用户名：
      <input id="login-user" type="text" autocomplete="username" />
    </label>
    <label>密码：
      <input id="login-pass" type="password" autocomplete="current-password" />
    </label>
    <button id="login-btn">登录</button>
    <div id="login-msg"></div>
  </section>

  <section id="form-section" style="display:none;">
    <h2>新建 / 覆盖画册</h2>

    <label>slug（文件名，不含 .md，例如：misty-mountain-2025）：</label>
    <input id="f-slug" type="text" />

    <label>标题：</label>
    <input id="f-title" type="text" />

    <label>简介：</label>
    <textarea id="f-desc"></textarea>

    <label>分类（用逗号分隔）：</label>
    <input id="f-cats" type="text" value="山水" />

    <label>图片列表（每行一个：image,title,desc,cover[true/false]）：</label>
    <textarea id="f-photos" placeholder="/uploads/xxx.jpg,标题,说明,true"></textarea>

    <button id="save-btn">保存到 GitHub</button>
    <div id="save-msg"></div>
  </section>

  <script>
    const API_BASE = "https://cms-api.gaozubing.cn";  // 你的 Worker 子域
    let token = null;

    const loginBtn = document.getElementById('login-btn');
    const loginMsg = document.getElementById('login-msg');

    loginBtn.onclick = async () => {
      const u = document.getElementById('login-user').value.trim();
      const p = document.getElementById('login-pass').value.trim();
      loginMsg.textContent = '';

      if (!u || !p) {
        loginMsg.textContent = "请输入用户名和密码";
        return;
      }

      loginBtn.disabled = true;
      loginMsg.textContent = "登录中…";

      try {
        const res = await fetch(API_BASE + "/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: u, password: p })
        });

        if (!res.ok) {
          loginMsg.textContent = "登录失败（" + res.status + "）";
          loginBtn.disabled = false;
          return;
        }

        const data = await res.json();
        token = data.token;
        loginMsg.textContent = "";

        document.getElementById('login-section').style.display = "none";
        document.getElementById('form-section').style.display = "block";
      } catch (e) {
        console.error(e);
        loginMsg.textContent = "网络错误或 API 无法访问";
      } finally {
        loginBtn.disabled = false;
      }
    };

    const saveBtn = document.getElementById('save-btn');
    const saveMsg = document.getElementById('save-msg');

    saveBtn.onclick = async () => {
      if (!token) {
        saveMsg.style.color = "#c0392b";
        saveMsg.textContent = "未登录或会话失效，请重新登录。";
        return;
      }

      const slug = document.getElementById('f-slug').value.trim();
      const title = document.getElementById('f-title').value.trim();
      const desc = document.getElementById('f-desc').value.trim();
      const cats = document.getElementById('f-cats').value
        .split(',')
        .map(s => s.trim())
        .filter(Boolean);

      const photosRaw = document.getElementById('f-photos').value
        .split('\n')
        .map(s => s.trim())
        .filter(Boolean);

      if (!slug || !title) {
        saveMsg.style.color = "#c0392b";
        saveMsg.textContent = "slug 和 标题 必填。";
        return;
      }

      const photos = photosRaw.map(line => {
        const [image, t, d, cover] = line.split(',').map(s => (s || '').trim());
        return {
          image,
          title: t || "",
          desc: d || "",
          cover: cover === 'true'
        };
      });

      saveBtn.disabled = true;
      saveMsg.style.color = "#333";
      saveMsg.textContent = "保存中…";

      try {
        const res = await fetch(API_BASE + "/save-album", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
          },
          body: JSON.stringify({
            slug,
            title,
            description: desc,
            categories: cats.length ? cats : ["山水"],
            photos
          })
        });

        if (!res.ok) {
          const text = await res.text();
          saveMsg.style.color = "#c0392b";
          saveMsg.textContent = "保存失败：" + text;
          return;
        }

        saveMsg.style.color = "green";
        saveMsg.textContent = "已保存到 GitHub，等 Cloudflare Pages 自动重新构建。";
      } catch (e) {
        console.error(e);
        saveMsg.style.color = "#c0392b";
        saveMsg.textContent = "网络错误或 API 失败。";
      } finally {
        saveBtn.disabled = false;
      }
    };
  </script>
</body>
</html>
